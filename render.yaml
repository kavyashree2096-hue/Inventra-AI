services:
  # Backend Flask REST API
  - type: web
    name: inventra-backend
    runtime: python
    rootDir: inventra-back
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventra-db
          property: connectionString

  # Frontend React Vite SPA
  - type: static
    name: inventra-frontend
    runtime: static
    rootDir: inventra-front
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: inventra-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: inventra-db
    databaseName: inventra_ai
    user: inventra_user
    plan: free
